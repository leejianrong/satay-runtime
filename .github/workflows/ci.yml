name: CI

on:
  push:
    branches: [main]
  pull_request:

# One in-flight run per ref; new pushes cancel the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .

  type:
    name: Type-check (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      # The studio extra is installed so FastAPI/uvicorn/Pydantic types resolve for the
      # V5 control server (satay.control.server), which mypy type-checks under src/ (V5).
      - run: uv sync --extra studio --frozen
      - name: mypy --strict
        run: uv run mypy src

  test:
    name: Unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The repo's `.python-version` pins 3.13 for local/worktree dev (KAN-521); it does
      # NOT constrain this matrix. setup-uv's `python-version` input exports `UV_PYTHON`,
      # which takes precedence over `.python-version`, so both legs really do run their
      # own interpreter. The lint and type jobs below set no version and therefore inherit
      # the pinned 3.13. Adding 3.14 here is a separate decision (it passes today, but the
      # matrix is the commitment to keep it passing) — see KAN-521.
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      # The studio extra is installed so the V5 HTTP-surface tests (FastAPI TestClient)
      # can run alongside the core suite.
      - run: uv sync --extra studio --frozen
      # Cheap fast-fail: the integration tier must import without any infra before the
      # full run (the subprocess-based import-hygiene assertion also runs below).
      - name: import-hygiene guard
        run: uv run pytest tests/integration --collect-only -q
      # Full test suite on both 3.12 and 3.13 (unit + integration + e2e): the V1-V4
      # end-to-end acceptance tests (crash-recovery, guarantees, timers, composite) plus
      # the V5 HTTP surface. The studio extra is installed so the HTTP tests run and the
      # subprocess-based import-hygiene test runs as part of the integration tier. The
      # job keeps the "Unit tests" name only for the branch-protection required-check
      # contract; it gates the whole suite.
      - name: pytest (full suite)
        run: uv run pytest -q

  # Studio frontend (ADR-0013/0018): builds and verifies the Svelte + Vite bundle with a
  # pinned Node + pnpm. This is the "prebuilt in CI" step — svelte-check, the Vitest
  # view-model unit tests, and `vite build`. It does NOT run a browser smoke test:
  # ADR-0011 verifies Studio through the JSON read API / view-models, not UI rendering.
  # New, independent job — it does not touch the four required Python checks above.
  frontend:
    name: Studio (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: studio/.nvmrc
      # Enable corepack AFTER Node is installed so the pnpm shim (pinned by the
      # packageManager field) is provisioned for this Node — avoids the cache/PATH
      # chicken-and-egg of setup-node's built-in pnpm cache.
      - name: Enable corepack (pnpm from packageManager field)
        run: corepack enable
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: svelte-check (typecheck)
        run: pnpm check
      - name: Vitest (view-model unit tests)
        run: pnpm test
      - name: Vite build (prebuilt bundle)
        run: pnpm build
