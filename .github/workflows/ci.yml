name: CI

on:
  push:
    branches: [main]
  pull_request:

# One in-flight run per ref; new pushes cancel the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .

  type:
    name: Type-check (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # The studio extra is installed so FastAPI/uvicorn/Pydantic types resolve for the
      # V5 control server (satay.control.server), which mypy type-checks under src/ (V5).
      - run: uv sync --extra studio --frozen
      - name: mypy --strict
        run: uv run mypy src

  test:
    name: Unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      # The studio extra is installed so the V5 HTTP-surface tests (FastAPI TestClient)
      # can run; the pure unit tiers do not need it (V5).
      - run: uv sync --extra studio --frozen
      - name: pytest (unit)
        run: uv run pytest tests/unit -q
      # Import-hygiene guard: the integration tier must import without any infra.
      - name: import-hygiene guard
        run: uv run pytest tests/integration --collect-only -q
      # V5 control/read API tests: the pure boundary tier + the HTTP-surface E2E tier,
      # plus the import-hygiene assertions (subprocess-based, so they run even here where
      # sibling tests import FastAPI) — proving the core-dependency boundary holds.
      - name: control API tests (V5)
        run: >-
          uv run pytest -q
          tests/integration/test_import_hygiene.py
          tests/integration/test_control_readapi.py
          tests/e2e/test_control_http.py
