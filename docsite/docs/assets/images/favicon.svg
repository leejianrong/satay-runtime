<?xml version="1.0" encoding="UTF-8"?>
<!--
  Favicon: the Abang ketupat mark, as a standalone SVG document.

  A favicon is rendered outside the page, so neither `currentColor` nor the
  `var(--bg)` knockout strokes can inherit anything from the docs' stylesheet.
  Rather than redraw the mark, this file keeps the six shape elements byte-for-byte
  identical to the landing page and supplies the two values they need from an
  internal stylesheet: `color` (which `currentColor` then resolves against) and
  `--bg` (the knockout). `prefers-color-scheme` swaps both to the Abang dark pair,
  so the weave still reads correctly against a dark tab strip.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="46" height="34" viewBox="0 0 46 34">
  <style>
    svg { color: #de5f1c; --bg: #f7f2ea; }
    @media (prefers-color-scheme: dark) {
      svg { color: #f5843a; --bg: #17110c; }
    }
  </style>
  <polygon points="15,5 27,17 15,29 3,17" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="31,5 43,17 31,29 19,17" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
  <line x1="21" y1="15" x2="25" y2="11" stroke="var(--bg)" stroke-width="3.4"/>
  <line x1="21" y1="23" x2="25" y2="19" stroke="var(--bg)" stroke-width="3.4"/>
  <line x1="20.5" y1="15.5" x2="23" y2="13" stroke="currentColor" stroke-width="2"/>
  <line x1="25.5" y1="18.5" x2="23" y2="21" stroke="currentColor" stroke-width="2"/>
</svg>
