# Zensical configuration for the user-facing Satay Runtime docs site.
#
# The site source lives here in `docsite/` so the planning artefacts in `docs/`
# (PRD, REQS, SHAPING, BREADBOARD, the ADRs, the slice specs) keep the paths that
# CLAUDE.md and the ADRs cross-reference.
#
# Build it with:   uvx zensical build --strict --clean   (run from this directory)
# Preview it with: uvx zensical serve
#
# `--strict` turns the link and anchor warnings into a failure, which is what the
# PR build-check in .github/workflows/docs.yml relies on.

[project]
site_name = "Satay Runtime"
site_description = """
Local-first durable execution for async Python: workflows that replay from the top \
after a crash and reuse the work that already finished.
"""
site_url = "https://leejianrong.github.io/satay-runtime/"
site_author = "Jian"
copyright = "Apache-2.0 licensed. Built from the satay-runtime repository."

docs_dir = "docs"
site_dir = "site"

# The Abang design language: tokens copied from the landing page, plus the mapping onto
# the theme's own `--md-*` variables. See the header of that file before editing it.
extra_css = ["assets/abang.css"]

repo_url = "https://github.com/leejianrong/satay-runtime"
repo_name = "leejianrong/satay-runtime"
edit_uri = "edit/main/docsite/docs"

# Navigation, in the FastAPI-docs shape: a landing page, a Tutorial - User Guide that
# is meant to be read top to bottom, task-shaped recipes, then lookup material and the
# project's own paperwork.
#
# Section titles are set here; page titles deliberately are *not*. A bare
# "path.md" entry takes its label from the page's own H1, so rewriting a heading can
# never leave the sidebar saying something the page does not.
nav = [
  "index.md",
  { "Tutorial - User Guide" = [
    "tutorial/index.md",
    "quickstart.md",
    "concepts.md",
    "determinism.md",
    "primitives.md",
    "tutorial/testing.md",
  ] },
  { "Cookbook" = [
    "cookbook/index.md",
    "cookbook/crash-recovery.md",
    "cookbook/retries.md",
    "cookbook/timers-events.md",
    "cookbook/fan-out.md",
    "cookbook/elt-pipeline.md",
    "cookbook/agentic-dag.md",
    "cookbook/fork-and-compare.md",
    "cookbook/studio-tour.md",
  ] },
  { "Reference" = [
    "guarantees.md",
    "fork.md",
    "studio.md",
  ] },
  { "Project" = [
    "limits.md",
    "decisions.md",
  ] },
]

# Fail the build on a link to a page that does not exist, or to an anchor that does
# not exist on the target page. Both default to on; stated here so nobody has to
# guess what --strict is actually enforcing.
[project.validation]
invalid_links = true
invalid_link_anchors = true

[project.theme]
language = "en"

# The Abang design language lives in `docs/assets/abang.css`; `custom_dir` exists so
# the ketupat mark can be inlined into the header rather than referenced as an image.
custom_dir = "overrides"
favicon = "assets/images/favicon.svg"

# Fonts are the landing page's system stacks, set in `abang.css`. Setting `font` to
# false is the other half of that: left at its default the theme links Inter and
# JetBrains Mono from fonts.googleapis.com, and the landing page deliberately ships
# no external fonts, scripts, or trackers.
font = false

features = [
  "content.code.annotate",
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

# `primary`/`accent` are "abang" rather than one of the theme's named colours on
# purpose. The names only end up in `data-md-color-primary` / `data-md-color-accent`
# on <body>, and the theme ships per-name overrides (e.g.
# `[data-md-color-scheme=slate][data-md-color-primary=deep-orange]`) that outrank a
# plain scheme selector. Using a name it has never heard of leaves the field clear for
# `docs/assets/abang.css` to set the real colours.
[[project.theme.palette]]
scheme = "default"
primary = "abang"
accent = "abang"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "abang"
accent = "abang"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/leejianrong/satay-runtime"
name = "satay-runtime on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/satay/"
name = "satay on PyPI"

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
